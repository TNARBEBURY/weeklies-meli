<style>
:root{
  --bg:#0f1117;--card:#181d2d;--card2:#1e2540;--border:#252d45;

  --blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--cyan:#06b6d4;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;margin:0;min-height:100vh}
.hdr{background:linear-gradient(135deg,#0b0f1a 0%,#141c38 50%,#0b0f1a 100%);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:20px;margin:0}
.hdr .sub{color:var(--muted);font-size:12px;margin-top:4px}
.tag{display:inline-block;background:var(--blue);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:5px}
.wrap{padding:24px 32px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--blue)}
.kpi.k-tpv::after{background:var(--purple)}
.kpi.k-con::after{background:var(--green)}
.kpi.k-sin::after{background:var(--muted)}
.kpi.k-cg::after{background:var(--green)}
.kpi.k-cp::after{background:var(--red)}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700}
.kpi .sub2{color:var(--muted);font-size:11px;margin-top:4px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:22px;overflow:hidden}
.sec-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sec-b{padding:20px}
.charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:900px){.charts-row{grid-template-columns:1fr}}
canvas{max-height:280px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(37,45,69,.6);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.r{text-align:right}
.c{text-align:center}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;min-width:220px}
.pill{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--muted);transition:all .15s}
.pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.prod-line{font-size:12px;line-height:1.5}
.prod-line b{color:var(--text)}
</style>
</head>

const usd = n => n>=1e6 ? '$'+(n/1e6).toFixed(1).replace('.0','')+'M' : n>=1e3 ? '$'+Math.round(n/1e3)+'K' : '$'+n;

function renderKpis(){
  const k = D.kpi;
  const items = [
    ['k-tot','Total cuentas', k.total, ''],
    ['k-tpv','TPV potencial', k.total_tpv_fmt, '/ mes'],
    ['k-con','Con oportunidad SF', k.con_opp, `${Math.round(100*k.con_opp/k.total)}% del total`],
    ['k-sin','Sin oportunidad creada', k.sin_opp, `${Math.round(100*k.sin_opp/k.total)}% del total`],
    ['k-cg','Cerrada ganada', k.cerrada_ganada, ''],
    ['k-cp','Cerrada perdida', k.cerrada_perdida, ''],
  ];
  document.getElementById('kpis').innerHTML = items.map(([cls,lbl,val,sub])=>
    `<div class="kpi ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div>${sub?`<div class="sub2">${sub}</div>`:''}</div>`
  ).join('');
}

let stageC, closC;
function renderStageChart(){
  const labels = D.stage_order.filter(s => D.stage_counts[s].count > 0);
  const counts = labels.map(s => D.stage_counts[s].count);
  const colors = labels.map(s => D.stage_color[s]);
  const ctx = document.getElementById('stageChart').getContext('2d');
  stageC = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label:'Cuentas', data: counts, backgroundColor: colors, borderRadius:4, maxBarThickness:34 }] },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display:false },
        tooltip: {
          backgroundColor:'#181d2d', borderColor:'#252d45', borderWidth:1, titleColor:'#fff', bodyColor:'#8892a4',
          callbacks: { afterLabel: (c)=> 'TPV: ' + usd(D.stage_counts[c.label].tpv) }
        }
      },
      scales: {
        x: { grid:{color:'rgba(37,45,69,.7)'}, ticks:{color:'#8892a4', precision:0} },
        y: { grid:{display:false}, ticks:{color:'#e2e8f0'} }
      }
    }
  });
}

function renderClosuresChart(){
  const rows = D.closures;
  const ctx = document.getElementById('closuresChart').getContext('2d');
  closC = new Chart(ctx, {
    type: 'bar',
    data: { labels: rows.map(r=>r.label), datasets: [{ label:'Cuentas cerradas (Cerrada Ganada)', data: rows.map(r=>r.count), backgroundColor:'#10b981', borderRadius:4, maxBarThickness:34 }] },
    options: {
      plugins: {
        legend:{display:false},
        tooltip: {
          backgroundColor:'#181d2d', borderColor:'#252d45', borderWidth:1, titleColor:'#fff', bodyColor:'#8892a4',
          callbacks: { afterLabel: (c)=> 'TPV: ' + usd(rows[c.dataIndex].tpv) }
        }
      },
      scales: {
        x: { grid:{display:false}, ticks:{color:'#8892a4'} },
        y: { grid:{color:'rgba(37,45,69,.7)'}, ticks:{color:'#8892a4', precision:0} }
      }
    }
  });
  if (!rows.length) {
    document.getElementById('closuresChart').parentElement.innerHTML = '<div class="muted" style="padding:40px 0;text-align:center">Todav&iacute;a no hay cierres (Cerrada Ganada) con fecha registrada en SF.</div>';
  }
}

function renderSupTable(){
  const rows = D.sup_stats;
  const html = `<table><thead><tr>
    <th>Supervisor</th><th class="r">Cuentas</th><th class="r">TPV Potencial</th>
    <th class="r">Con Opp SF</th><th class="r">Sin Opp</th><th class="r">Cerrada Ganada</th><th class="r">Cerrada Perdida</th>
  </tr></thead><tbody>` +
  rows.map(r => `<tr>
    <td><b>${r.sup}</b></td><td class="r">${r.total}</td><td class="r">${usd(r.tpv)}</td>
    <td class="r">${r.con_opp}</td><td class="r muted">${r.sin_opp}</td>
    <td class="r" style="color:#10b981">${r.cerrada_ganada}</td><td class="r" style="color:#ef4444">${r.cerrada_perdida||0}</td>
  </tr>`).join('') + '</tbody></table>';
  document.getElementById('supTable').innerHTML = html;
}

let filterSup = 'all', filterStage = 'all';

function renderPills(){
  const sups = [...new Set(D.accounts.map(a=>a.sup))].filter(Boolean).sort();
  document.getElementById('supPills').innerHTML =
    `<span class="pill ${filterSup==='all'?'active':''}" data-sup="all">Todos</span>` +
    sups.map(s=>`<span class="pill ${filterSup===s?'active':''}" data-sup="${s}">${s}</span>`).join('');
  const stages = D.stage_order.filter(s=>D.stage_counts[s].count>0);
  document.getElementById('stagePills').innerHTML =
    `<span class="pill ${filterStage==='all'?'active':''}" data-stage="all">Todas las etapas</span>` +
    stages.map(s=>`<span class="pill ${filterStage===s?'active':''}" data-stage="${s}" style="--c:${D.stage_color[s]}">${s}</span>`).join('');

  document.querySelectorAll('[data-sup]').forEach(el=>el.onclick=()=>{filterSup=el.dataset.sup; renderPills(); renderAcctTable();});
  document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{filterStage=el.dataset.stage; renderPills(); renderAcctTable();});
}

function prodLine(prod, owner, stage){
  if (!stage) return `<span class="muted">${prod}: Sin Oportunidad Creada</span>`;
  return `<span class="prod-line">${prod}: <b>${stage}</b> · ${owner}</span>`;
}

function renderAcctTable(){
  const q = (document.getElementById('search').value || '').toLowerCase();
  let rows = D.accounts.filter(a =>
    (filterSup==='all' || a.sup===filterSup) &&
    (filterStage==='all' || a.stage===filterStage) &&
    (!q || (a.marca+' '+a.hunter+' '+(a.industria||'')).toLowerCase().includes(q))
  );
  rows = rows.sort((a,b)=> b.tpv_pot - a.tpv_pot);
  const html = `<table><thead><tr>
    <th>Marca</th><th>Hunter</th><th>Sup</th><th>Industria</th><th class="r">TPV Pot</th>
    <th>Mes Activaci&oacute;n</th><th>Point</th><th>QR</th><th>Etapa</th>
  </tr></thead><tbody>` +
  rows.map(a => `<tr>
    <td><b>${a.marca}</b></td>
    <td>${a.hunter}</td>
    <td>${a.sup}</td>
    <td class="muted">${a.industria||'—'}</td>
    <td class="r">${a.tpv_fmt}</td>
    <td class="c muted">${a.mes_activ_label}</td>
    <td>${prodLine('Point', a.point_owner, a.point_stage)}</td>
    <td>${prodLine('QR', a.qr_owner, a.qr_stage)}</td>
    <td><span class="badge" style="background:${D.stage_color[a.stage]}33;color:${D.stage_color[a.stage]}">${a.stage}</span></td>
  </tr>`).join('') + '</tbody></table>' +
  `<div class="muted" style="padding-top:10px;font-size:12px">${rows.length} de ${D.accounts.length} cuentas</div>`;
  document.getElementById('acctTable').innerHTML = html;
}

document.getElementById('search').addEventListener('input', renderAcctTable);

renderKpis();
renderStageChart();
renderClosuresChart();
renderSupTable();
renderPills();
renderAcctTable();
</script>
</body>
</html>
